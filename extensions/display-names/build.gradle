plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

version = '1.0.0'
group = 'dev.botc'

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.6:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    // Compile against the exact FancyMenu version in the pinned upstream pack.
    modCompileOnly files(providers.gradleProperty('fancyMenuJar').getOrElse('../../server/mods/fancymenu_fabric_3.9.10_MC_1.21.11.jar'))
}

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }

tasks.register('checkNames', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.botc.names.DisplayNamesCheck'
    enableAssertions = true
}
check.dependsOn checkNames
// The assertion-based check above deliberately needs no test framework.
test { enabled = false }
